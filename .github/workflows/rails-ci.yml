name: Rails CI

on:
  workflow_call:
    inputs:
      apt_packages:
        description: Space-separated apt packages to install alongside setup (e.g. "libvips")
        type: string

      brakeman_version:
        description: Brakeman gem version to run via reviewdog (omit to skip, e.g. "8.0.5")
        type: string

      dependency_audit_command:
        description: Dependency audit command to run (omit to skip)
        type: string

      extra_env:
        description: >
          Additional non-secret environment variables, one KEY=VALUE per
          line (same format as a .env file). Use this for anything the app
          requires that isn't already covered by an existing input. For
          real secret values, use the extra_secrets secret instead —
          `secrets.*` can't be referenced here since this is a `with:`
          input, evaluated before the caller's secrets are in scope.
        type: string

      failure-screenshot-dir:
        description: the directory where your test runner saves screenshots on failure
        type: string
        default: tmp/capybara

      js_lint_command:
        description: JS linting command to run (omit to skip)
        type: string

      playwright:
        description: Install the Playwright Chromium browser (for apps using capybara-playwright-driver)
        type: boolean
        default: false

      postgres_version:
        description: Postgres Docker image version tag
        type: string
        default: "17"

      project_stats:
        description: Run `bin/rails stats` and post the results to the job summary
        type: boolean
        default: false

      rubocop_command:
        description: Rubocop command to run (omit to skip)
        type: string

      runner:
        description: Runner to use
        type: string
        default: blacksmith-8vcpu-ubuntu-2404

      timeout:
        description: Job timeout in minutes
        type: number
        default: 20

    secrets:
      RAILS_MASTER_KEY:
        description: Rails master key for decrypting credentials
        required: false
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM:
        description: Credential for the RoleModel RubyGems package registry
        required: false
      extra_secrets:
        description: >
          Additional secret environment variables, one KEY=VALUE per line
          (same shape as extra_env). Pass real secret values through here,
          referencing the caller's own secrets context on the right-hand
          side of each line.
        required: false
env:
  BUNDLE_WITHOUT: production
  CI: true
  RAILS_ENV: test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  PARALLEL_TEST_FIRST_IS_1: false

jobs:
  ci:
    name: CI
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      checks: write
      contents: read
    env:
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM || secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgres:${{ inputs.postgres_version }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Extra Env
        if: ${{ inputs.extra_env }}
        run: echo "${{ inputs.extra_env }}" >> "$GITHUB_ENV"

      - name: Set Extra Secrets
        env:
          EXTRA_SECRETS: ${{ secrets.extra_secrets }}
        if: ${{ env.EXTRA_SECRETS != '' }}
        run: echo "$EXTRA_SECRETS" >> "$GITHUB_ENV"

      # Ruby/gems and apt packages background immediately; corepack → node → yarn
      # chain in the foreground so yarn install can overlap with the slow installs.
      # Below, gem-only and yarn-only steps are unblocked as soon as their one
      # real dependency finishes, rather than all waiting on each other.
      - name: Install Ruby and Gems
        id: install-ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        background: true

      # Guarded in the shell rather than with a step-level `if` so the step
      # always completes and the `wait: [install-apt]` below always resolves.
      - name: Install system packages
        id: install-apt
        run: |
          if [ -n "${{ inputs.apt_packages }}" ]; then
            sudo apt-get update && sudo apt-get install -y ${{ inputs.apt_packages }}
          fi
        background: true

      - name: Find Preinstalled Chrome
        run: echo "GOOGLE_CHROME_BIN=$(which google-chrome || which google-chrome-stable)" >> "$GITHUB_ENV"
        background: true

      - name: Restore Asset Cache
        id: cache-assets
        uses: actions/cache/restore@v6
        with:
          path: |
            public/assets
            app/assets/builds
          key: >-
            rails-assets-${{ hashFiles('app/assets/images/**/*', 'app/assets/stylesheets/**/*',
            'app/assets/config/**/*', 'app/javascript/**/*', '*.config.js', '*.config.mjs',
            '*.config.cjs', '*.config.ts', '.node-version', 'yarn.lock',
            'Gemfile.lock') }}
        background: true

      - name: Enable Corepack
        if: ${{ hashFiles('yarn.lock') != '' }}
        run: corepack enable

      - name: Setup Node
        if: ${{ hashFiles('yarn.lock') != '' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install Yarn Packages
        id: install-yarn
        if: ${{ hashFiles('yarn.lock') != '' }}
        run: yarn install --immutable
        background: true

      - name: Cache Playwright Chromium Browser
        if: ${{ inputs.playwright }}
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        background: true

      # No dependencies of its own, so it can fire immediately too.
      - name: Load Previous Turbo-Test Runtime Stats
        uses: actions/cache/restore@v6
        with:
          path: tmp/turbo_rspec_runtime.log
          key: parallel-spec-runtimes-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            parallel-spec-runtimes-${{ github.head_ref || github.ref_name }}-
            parallel-spec-runtimes-
        background: true

      # Gem-only work can start as soon as gems are ready, instead of waiting
      # on node/yarn/assets too.
      - wait: [install-ruby]

      - name: Rubocop
        if: ${{ inputs.rubocop_command }}
        run: ${{ inputs.rubocop_command }}
        background: true

      - name: Dependency Audit
        if: ${{ inputs.dependency_audit_command }}
        run: ${{ inputs.dependency_audit_command }}
        background: true

      - name: Brakeman
        if: ${{ inputs.brakeman_version }}
        uses: reviewdog/action-brakeman@v2
        with:
          brakeman_version: ${{ inputs.brakeman_version }}
          reporter: github-pr-check
        background: true

      - name: Project Stats
        if: ${{ inputs.project_stats }}
        uses: RoleModel/actions/project-stats@v3
        with:
          install-ruby: false
        background: true

      # Booting the app loads gems (poppler, vips, …) that dlopen the system
      # libraries from apt_packages, so app-booting steps must also wait on
      # install-apt — otherwise DB setup races the apt install and fails
      # intermittently with e.g. "Typelib file for namespace 'Poppler' not
      # found". Lint steps above don't boot the app, so they start sooner.
      - wait: [install-apt]

      - name: Setup Parallel Databases
        run: bundle exec rake parallel:create parallel:load_schema
        background: true

      # Yarn-only work can start as soon as node_modules are ready.
      - wait: [install-yarn]

      - name: ESLint
        if: ${{ inputs.js_lint_command }}
        run: ${{ inputs.js_lint_command }}
        background: true

      # Needs gems + yarn + apt packages (all already waited-for above) and
      # the asset cache lookup, but nothing from the playwright cache.
      - wait: [cache-assets]

      - name: Compile Assets
        if: ${{ steps.cache-assets.outputs.cache-hit != 'true' }}
        run: bundle exec rails assets:precompile
        background: true

      - wait: [cache-playwright]

      - name: Install Playwright Chromium Browser
        if: ${{ inputs.playwright && steps.cache-playwright.outputs.cache-hit != 'true' }}
        run: yarn playwright install --with-deps chromium
        background: true

      - wait-all: true

      # Doesn't need to finish before tests start, only before the job ends —
      # the wait below is a cheap correctness net, not an expected delay,
      # since the upload finishes long before the test run does.
      - name: Save Asset Cache
        if: steps.cache-assets.outputs.cache-hit != 'true'
        id: save-asset-cache
        uses: actions/cache/save@v6
        with:
          path: |
            public/assets
            app/assets/builds
          key: ${{ steps.cache-assets.outputs.cache-primary-key }}
        background: true

      - name: Run Rspec Tests
        run: bundle exec parallel_rspec --verbose spec/
        env:
          CAPYBARA_DRIVER: js

      - wait: [save-asset-cache]

      # None of these read each other's output — all four only consume
      # artifacts already produced by Run Rspec Tests above.
      - parallel:
          - name: Save Turbo-Test Runtime Stats
            if: always()
            uses: actions/cache/save@v6
            with:
              path: tmp/turbo_rspec_runtime.log
              key: parallel-spec-runtimes-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

          - name: Publish Test Results
            uses: mikepenz/action-junit-report@v6
            if: always()
            with:
              check_name: Test Results
              report_paths: tmp/rspec-*.xml
              detailed_summary: true

          - name: Analyze Test Runtimes
            uses: RoleModel/actions/test-runtime-analyzer@v1
            with:
              test-output-path: tmp/turbo_rspec_runtime.log

          - name: Upload Screenshots
            if: failure()
            uses: actions/upload-artifact@v7
            with:
              name: rspec-screenshots
              path: ${{ inputs.failure-screenshot-dir }}

      - name: Cleanup
        uses: RoleModel/actions/test-cleanup@v1
        with:
          artifact-prefix: rspec
